[package]
name = "minicon-surf-servo-api-probe"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "servo-w1-runtime"
path = "src/main.rs"

[[bin]]
name = "servo-w3-runtime"
path = "src/w3.rs"

[dependencies]
dpi = "=0.1.2"
percent-encoding = "=2.3.2"
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde_json = "=1.0.151"
servo = { version = "=0.5.0", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"] }
servo-base = "=0.5.0"
servo-profile-traits = "=0.5.0"
tikv-jemalloc-sys = { version = "=0.6.1", features = ["stats"] }
url = "=2.5.8"
