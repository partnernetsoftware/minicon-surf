[package]
name = "minicon-surf-tls-court"
version = "0.0.0"
edition = "2024"
publish = false
description = "Standalone TLS candidate probe for the native route's HTTPS design; never linked into the host"

[[bin]]
name = "tls-probe"
path = "src/main.rs"

[features]
default = []
# Pure-Rust TLS with ring's crypto (C and perlasm inside ring).
rustls-ring = ["dep:rustls", "dep:rustls-pki-types", "rustls/ring", "rustls/std", "rustls/tls12", "rustls/logging"]
# rustls with the aws-lc-rs backend (C library built by cmake).
rustls-aws-lc = ["dep:rustls", "dep:rustls-pki-types", "rustls/aws_lc_rs", "rustls/std", "rustls/tls12", "rustls/logging"]
# macOS Security.framework SecureTransport through the security-framework crate.
secure-transport = ["dep:security-framework"]

[dependencies]
base64 = "=0.22.1"
libc = "=0.2.189"
serde_json = "=1.0.151"
rustls = { version = "=0.23.43", optional = true, default-features = false }
rustls-pki-types = { version = "=1.15.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true, features = ["alpn"] }
