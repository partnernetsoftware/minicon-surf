<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MiniCon Surf Interactive Court</title>
  </head>
  <body>
    <main>
      <h1>Memory and Agent Court</h1>
      <label for="query">Query</label>
      <input id="query" name="query" value="bounded browser">
      <button id="continue" type="button">Continue</button>
      <a href="https://example.com/result">Example result</a>
    </main>
    <script>
      const button = document.getElementById("continue");
      button.addEventListener("click", () => {
        button.textContent = "Clicked";
        const status = document.createElement("p");
        status.id = "status";
        status.textContent = "Continued";
        document.querySelector("main").append(status);
      });
    </script>
  </body>
</html>
