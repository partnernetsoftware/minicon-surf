<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MiniCon Surf Script Court</title>
  </head>
  <body>
    <main id="result"><h1>Before script</h1></main>
    <script>
      const result = document.getElementById("result");
      result.replaceChildren();
      const heading = document.createElement("h1");
      heading.textContent = "After script";
      const button = document.createElement("button");
      button.textContent = "Agent visible action";
      result.append(heading, button);
      document.documentElement.dataset.court = "script-complete";
    </script>
  </body>
</html>
