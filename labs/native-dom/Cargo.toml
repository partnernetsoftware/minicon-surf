[package]
name = "minicon-surf-native-dom"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "native-dom-control"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
fs2 = "=0.4.3"
getrandom = "=0.2.17"
dom_query = { version = "=0.27.0", default-features = false }
rquickjs = { version = "=0.12.2", features = ["allocator"] }
native-dom-surface = { path = "../native-dom-surface" }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "=1.15.1"
serde_json = "=1.0.151"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
url = "=2.5.8"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
